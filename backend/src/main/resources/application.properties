
# Application
spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]
server.port=8080

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tlcn_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Authentication
app.auth.mail-from=${MAIL_FROM:}
app.auth.jwt-secret=${JWT_SECRET:}

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Error Handling
# server.error.include-message=never
# server.error.include-stacktrace=never
